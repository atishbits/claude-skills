<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="generator" content="html-slides">
<style>
/* Colour tokens. Light by default, dark from the system setting unless the
   viewer picked light, or when the viewer picked dark (T key / button). */
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #eeece6; --ink: #1c1d21; --ink-2: #555a63;
  --line: #d9d6cd; --accent: {{ACCENT}}; --accent-ink: #ffffff; --accent-soft: {{ACCENT}}1f;
  --good: #1f8a5b; --bad: #c2412d; --warn: #b7791f;
  --c1: {{ACCENT}}; --c2: #e08a2c; --c3: #2e9e8f; --c4: #8a5cc7; --c5: #d0557a; --c6: #7a8494;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --surface: #1e2026; --surface-2: #272a31; --ink: #eceae4; --ink-2: #a3a8b2;
    --line: #353943; --accent-soft: {{ACCENT}}33; --good: #4cc38a; --bad: #f0735e; --warn: #e3a64a;
    --c2: #f0a14a; --c3: #45c2b1; --c4: #a782e0; --c5: #e57a9b; --c6: #9aa3b2;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #15161a; --surface: #1e2026; --surface-2: #272a31; --ink: #eceae4; --ink-2: #a3a8b2;
  --line: #353943; --accent-soft: {{ACCENT}}33; --good: #4cc38a; --bad: #f0735e; --warn: #e3a64a;
  --c2: #f0a14a; --c3: #45c2b1; --c4: #a782e0; --c5: #e57a9b; --c6: #9aa3b2;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); overflow: hidden;
  font: 400 clamp(15px, 1.15vw + 9px, 22px)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent); }
strong { font-weight: 650; }
.deck { position: fixed; inset: 0; }
.progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0; transition: width .25s ease; z-index: 5; }

.slide {
  position: absolute; inset: 0; display: none; overflow-y: auto; overflow-x: hidden;
  padding: max(28px, 5vh) max(16px, 6vw) 88px; -webkit-overflow-scrolling: touch;
}
.slide.active { display: flex; animation: in .28s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.still .slide.active { animation: none; }
@media (prefers-reduced-motion: reduce) { .slide.active { animation: none; } .progress { transition: none; } }
.inner { margin: auto; width: 100%; max-width: 1120px; display: flex; flex-direction: column; gap: clamp(14px, 2.4vh, 28px); }

.kicker { font-size: .72em; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 650; }
h1, h2 { margin: 0; line-height: 1.12; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: clamp(32px, 4.4vw + 10px, 76px); font-weight: 760; }
h2 { font-size: clamp(24px, 2.3vw + 10px, 46px); font-weight: 720; }
.sub { color: var(--ink-2); font-size: 1.1em; max-width: 46ch; text-wrap: pretty; }
.takeaway {
  border-left: 4px solid var(--accent); background: var(--accent-soft); padding: .6em .9em;
  border-radius: 0 10px 10px 0; font-weight: 560;
}
.source { color: var(--ink-2); font-size: .66em; margin-top: auto; }
.notes { display: none; }
body.show-notes .notes { display: block; border: 1px dashed var(--line); border-radius: 10px; padding: .6em .9em; color: var(--ink-2); font-size: .8em; }

/* title / section / statement */
.slide.t-title .inner, .slide.t-section .inner { max-width: 960px; }
.slide.t-title h1 { font-size: clamp(36px, 5.2vw + 10px, 88px); }
.slide.t-title .meta { color: var(--ink-2); font-size: .8em; }
.slide.t-title .bar, .slide.t-section .bar { width: 72px; height: 6px; border-radius: 3px; background: var(--accent); }
.slide.t-section h1 { font-size: clamp(32px, 4vw + 10px, 72px); }
.slide.t-statement h1 { font-size: clamp(30px, 3.6vw + 12px, 68px); max-width: 22ch; }
.em { color: var(--accent); }

/* bullets */
ul.bullets { list-style: none; margin: 0; padding: 0; display: grid; gap: .7em; }
ul.bullets li { display: flex; gap: .7em; align-items: baseline; font-size: 1.12em; }
ul.bullets li::before { content: ""; flex: none; width: .55em; height: .55em; border-radius: 2px; background: var(--accent); transform: translateY(-.1em); }

/* stats */
.stats { display: grid; gap: clamp(10px, 1.6vw, 20px); grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1em 1.1em; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .2em; }
.stat .value { font-size: clamp(30px, 2.8vw + 12px, 58px); font-weight: 760; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .label { color: var(--ink-2); font-size: .85em; }
.stat .delta { font-size: .78em; font-weight: 600; }
.good { color: var(--good); } .bad { color: var(--bad); } .neutral { color: var(--ink-2); }

/* bars */
.bars { display: grid; gap: .55em; }
.bar-row { display: grid; grid-template-columns: minmax(6em, 28%) 1fr auto; gap: .8em; align-items: center; }
.bar-row .lab { font-size: .9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 1.25em; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--accent); border-radius: 6px; min-width: 2px; }
.bar-row.hl .fill { background: var(--c2); }
.bar-row .val { font-variant-numeric: tabular-nums; font-size: .9em; font-weight: 600; min-width: 4.5em; text-align: right; }
@media (max-width: 600px) {
  .bar-row { grid-template-columns: 1fr auto; row-gap: .25em; }
  .bar-row .track { grid-column: 1 / -1; grid-row: 2; }
}

/* columns (values over time) */
.cols { display: flex; align-items: flex-end; gap: clamp(4px, 1vw, 14px); height: clamp(180px, 40vh, 420px); padding-top: 1.6em; border-bottom: 2px solid var(--line); }
.col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
.col .cv { font-size: .7em; font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: .2em; white-space: nowrap; }
.col .cb { width: 100%; max-width: 72px; background: var(--accent); border-radius: 6px 6px 0 0; opacity: .8; }
.col.hl .cb { background: var(--c2); opacity: 1; }
.col-labels { display: flex; gap: clamp(4px, 1vw, 14px); }
.col-labels span { flex: 1; text-align: center; font-size: .7em; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 600px) { .col .cv { font-size: .58em; } }

/* share (parts of a whole) */
.share-bar { display: flex; height: clamp(44px, 8vh, 72px); border-radius: 12px; overflow: hidden; gap: 2px; }
.share-bar div { min-width: 3px; }
.legend { display: grid; gap: .5em 1.4em; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.legend div { display: flex; gap: .6em; align-items: center; font-size: .9em; }
.legend i { flex: none; width: .9em; height: .9em; border-radius: 3px; }
.legend b { margin-left: auto; font-variant-numeric: tabular-nums; }

/* blocks */
.blocks { display: grid; gap: clamp(10px, 1.6vw, 18px); grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.block { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--bc, var(--accent)); border-radius: 14px; padding: .9em 1em; box-shadow: var(--shadow); }
.block .bi { font-size: 1.5em; line-height: 1; margin-bottom: .3em; }
.block h3 { margin: 0 0 .25em; font-size: 1em; }
.block p { margin: 0; color: var(--ink-2); font-size: .86em; }

/* flow */
.flow { display: flex; align-items: stretch; gap: 0; }
.step { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: .8em .9em; box-shadow: var(--shadow); min-width: 0; }
.step .n { display: inline-grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: .75em; font-weight: 700; margin-bottom: .4em; }
.step h3 { margin: 0 0 .2em; font-size: .95em; }
.step p { margin: 0; color: var(--ink-2); font-size: .8em; }
.arrow { flex: none; display: grid; place-items: center; width: clamp(22px, 2.6vw, 40px); color: var(--accent); }
.arrow svg { width: 100%; height: auto; }
@media (max-width: 760px) {
  .flow { flex-direction: column; }
  .arrow { width: 100%; height: 28px; }
  .arrow svg { width: 22px; transform: rotate(90deg); }
}

/* layers (architecture stack) */
.layers { display: grid; gap: 8px; }
.layer { display: grid; grid-template-columns: minmax(7em, 22%) 1fr; gap: .9em; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--lc, var(--accent)); border-radius: 12px; padding: .65em .9em; }
.layer h3 { margin: 0; font-size: .92em; }
.layer .chips { display: flex; flex-wrap: wrap; gap: .4em; }
.chip { background: var(--surface-2); border-radius: 999px; padding: .2em .7em; font-size: .78em; }
@media (max-width: 600px) { .layer { grid-template-columns: 1fr; gap: .4em; } }

/* compare */
.compare { display: grid; gap: clamp(10px, 1.6vw, 20px); grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1em 1.1em; box-shadow: var(--shadow); }
.side.pick { border: 2px solid var(--accent); }
.side h3 { margin: 0 0 .5em; font-size: 1.05em; display: flex; justify-content: space-between; gap: .5em; }
.side .tag { font-size: .66em; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: .2em .7em; align-self: center; }
.side ul { margin: 0; padding-left: 1.1em; display: grid; gap: .35em; font-size: .9em; }

/* timeline */
.timeline { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 12px; padding-top: 1.4em; }
.timeline::before { content: ""; position: absolute; left: 0; right: 0; top: .45em; height: 2px; background: var(--line); }
.event { position: relative; }
.event::before { content: ""; position: absolute; top: -1.25em; left: 0; width: .8em; height: .8em; border-radius: 50%; background: var(--accent); }
.event .when { font-size: .72em; font-weight: 700; color: var(--accent); }
.event h3 { margin: .1em 0 .15em; font-size: .92em; }
.event p { margin: 0; font-size: .78em; color: var(--ink-2); }
@media (max-width: 700px) {
  .timeline { grid-auto-flow: row; padding: 0 0 0 1.6em; }
  .timeline::before { left: .35em; right: auto; top: 0; bottom: 0; width: 2px; height: auto; }
  .event::before { top: .3em; left: -1.6em; }
}

/* table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .86em; }
th, td { padding: .55em .8em; text-align: left; border-bottom: 1px solid var(--line); }
th { background: var(--surface-2); font-weight: 650; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }

/* quote */
.slide.t-quote blockquote { margin: 0; font-size: clamp(24px, 2.4vw + 10px, 48px); font-weight: 600; line-height: 1.25; max-width: 28ch; }
.slide.t-quote blockquote::before { content: "\201C"; color: var(--accent); }
.slide.t-quote blockquote::after { content: "\201D"; color: var(--accent); }
.slide.t-quote .by { color: var(--ink-2); }

/* svg */
.diagram { width: 100%; display: grid; place-items: center; }
.diagram svg { width: 100%; height: auto; max-height: 62vh; }

/* sources */
ol.srcs { margin: 0; padding-left: 1.3em; display: grid; gap: .45em; font-size: .82em; }
ol.srcs .d { color: var(--ink-2); }

/* controls */
.controls { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); z-index: 6; }
.controls button { appearance: none; border: 0; background: transparent; color: var(--ink); width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; font: inherit; }
.controls button:hover { background: var(--surface-2); }
.controls button:disabled { opacity: .3; cursor: default; }
.controls svg { width: 20px; height: 20px; }
.counter { font-size: .72em; color: var(--ink-2); min-width: 4.2em; text-align: center; font-variant-numeric: tabular-nums; }
.overview { position: fixed; inset: 0; background: var(--bg); z-index: 8; display: none; overflow-y: auto; padding: 24px max(16px, 6vw) 96px; }
.overview.open { display: block; }
.overview h2 { font-size: 1.1em; margin-bottom: .8em; }
.overview ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.overview button { width: 100%; text-align: left; appearance: none; font: inherit; font-size: .85em; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .7em .9em; cursor: pointer; display: flex; gap: .7em; }
.overview button.cur { border-color: var(--accent); }
.overview .k { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hint { position: fixed; top: 10px; right: 14px; font-size: .62em; color: var(--ink-2); z-index: 4; }
@media (hover: none) { .hint { display: none; } }

@media print {
  body { overflow: visible; }
  .deck { position: static; }
  .slide { position: relative; display: flex !important; height: 100vh; page-break-after: always; overflow: hidden; animation: none !important; }
  .controls, .progress, .hint, .overview { display: none !important; }
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<main class="deck" id="deck" aria-live="polite">
{{SLIDES}}
</main>
<nav class="overview" id="overview" aria-label="All slides"><h2>{{TITLE}}</h2><ol id="ov-list"></ol></nav>
<div class="hint">← → to move · O overview · T theme · N notes</div>
<div class="controls" role="toolbar" aria-label="Slide controls">
  <button id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="counter" id="counter">1 / 1</span>
  <button id="next" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <button id="ov" aria-label="All slides"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
  <button id="theme" aria-label="Switch light or dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
</div>
<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var cur = 0, n = slides.length;
  var $ = function (id) { return document.getElementById(id); };
  var ov = $('overview'), list = $('ov-list');
  if (/[?&](layoutcheck|shot)=1/.test(location.search)) document.documentElement.classList.add('still');

  function show(k, fromHash) {
    k = Math.max(0, Math.min(n - 1, k));
    slides[cur].classList.remove('active'); slides[cur].setAttribute('aria-hidden', 'true');
    cur = k;
    slides[cur].classList.add('active'); slides[cur].removeAttribute('aria-hidden'); slides[cur].scrollTop = 0;
    $('counter').textContent = (cur + 1) + ' / ' + n;
    $('progress').style.width = (n > 1 ? cur / (n - 1) * 100 : 100) + '%';
    $('prev').disabled = cur === 0; $('next').disabled = cur === n - 1;
    var items = list.querySelectorAll('button');
    for (var i = 0; i < items.length; i++) items[i].classList.toggle('cur', i === cur);
    if (!fromHash) { try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {} }
  }
  function next() { show(cur + 1); }
  function prev() { show(cur - 1); }
  function toggleOverview(open) { ov.classList.toggle('open', open === undefined ? !ov.classList.contains('open') : open); }
  function toggleTheme() {
    var r = document.documentElement, dark = r.getAttribute('data-theme') ? r.getAttribute('data-theme') === 'dark'
      : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    r.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('html-slides-theme', r.getAttribute('data-theme')); } catch (e) {}
  }
  try { var t = localStorage.getItem('html-slides-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}

  slides.forEach(function (s, i) {
    s.setAttribute('aria-hidden', 'true');
    var li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = '<span class="k">' + (i + 1) + '</span><span></span>';
    b.lastChild.textContent = s.getAttribute('data-title') || ('Slide ' + (i + 1));
    b.onclick = function () { toggleOverview(false); show(i); };
    li.appendChild(b); list.appendChild(li);
  });

  $('prev').onclick = prev; $('next').onclick = next;
  $('ov').onclick = function () { toggleOverview(); }; $('theme').onclick = toggleTheme;

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter' && !ov.classList.contains('open')) { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); prev(); }
    else if (k === 'ArrowDown' || k === 'ArrowUp') {
      var s = slides[cur];
      if (s.scrollHeight <= s.clientHeight + 2) { e.preventDefault(); k === 'ArrowDown' ? next() : prev(); }
    }
    else if (k === 'Home') { show(0); } else if (k === 'End') { show(n - 1); }
    else if (k === 'o' || k === 'O' || k === 'g' || k === 'G') { toggleOverview(); }
    else if (k === 'Escape') { toggleOverview(false); }
    else if (k === 't' || k === 'T') { toggleTheme(); }
    else if (k === 'n' || k === 'N') { document.body.classList.toggle('show-notes'); }
    else if (k === 'f' || k === 'F') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (err) {} }
  });

  // Swipe left / right on a touch screen. A mostly vertical drag is left to scrolling.
  var x0 = null, y0 = null;
  document.addEventListener('touchstart', function (e) { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null || ov.classList.contains('open')) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) { dx < 0 ? next() : prev(); }
  }, { passive: true });

  // Tap the left or right edge of a slide to move, like a photo viewer.
  $('deck').addEventListener('click', function (e) {
    if (e.target.closest('a, button, table, .tbl-wrap') || (window.getSelection && String(window.getSelection()))) return;
    var w = window.innerWidth;
    if (e.clientX > w * 0.75) next(); else if (e.clientX < w * 0.25) prev();
  });
  window.addEventListener('hashchange', function () { var h = parseInt(location.hash.slice(1), 10); if (h) show(h - 1, true); });

  var h0 = parseInt((location.hash || '').slice(1), 10);
  show(h0 ? h0 - 1 : 0, true);

  // Layout check, used by check_layout.py in a headless browser: which slides
  // need scrolling at this window size. Harmless for a viewer.
  if (/[?&]layoutcheck=1/.test(location.search)) {
    var out = [];
    slides.forEach(function (s, i) {
      s.style.display = 'flex';
      var over = s.scrollHeight - s.clientHeight, wide = s.scrollWidth - s.clientWidth;
      out.push({ slide: i + 1, overflow_px: Math.max(0, over), overflow_x_px: Math.max(0, wide) });
      s.style.display = '';
    });
    var m = document.createElement('meta'); m.name = 'layout-check';
    m.content = JSON.stringify({ width: window.innerWidth, height: window.innerHeight, slides: out });
    document.head.appendChild(m);
  }
})();
</script>
</body>
</html>
